<div class="container">
  <div class="row justify-content-center">
    <div class="col-8 mb-5">
      <form [formGroup]="searchForm" (ngSubmit)="search()">
        <app-from-select
          [control]="centerId"
          label="Center"
          [options]="centerOptions()"
          placeholder="Choose center..."
          [errorMessages]="{ min: 'Please center a sport' }"
        ></app-from-select>
        <button type="submit" class="btn btn-primary mt-3">Search</button>
      </form>
    </div>
  </div>
  <div class="row justify-content-center">
    <div class="col-8 mt-3">
      <app-data-table
        [columns]="columns"
        [data]="sports() ?? []"
        [showActions]="true"
        (edit)="onEditSport($event)"
        (delete)="onDeleteSport($event)"
      ></app-data-table>
    </div>
  </div>
  <div class="row justify-content-center">
    <div class="col-8">
      <button class="btn btn-primary" routerLink="/admin/sports/create">Add sport</button>
    </div>
  </div>
</div>
