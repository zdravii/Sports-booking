<div class="container">
  <div class="row justify-content-center">
    <div class="col-8">
      <form [formGroup]="editForm" (ngSubmit)="editCenter()">
        <app-form-input
          [control]="name"
          label="Sport name :"
          [errorMessage]="{
            required: 'Name is required',
            minlength: 'Name cannnot contain less than 4 characters',
            maxlength: 'Name cannnot contain more than 50 characters',
          }"
        ></app-form-input>
        <app-form-input
          [control]="description"
          label="Description :"
          [errorMessage]="{
            required: 'Description is required',
            minlength: 'Description cannnot contain less than 20 characters',
            maxlength: 'Description cannnot contain more than 500 characters',
          }"
        ></app-form-input>
        <button type="submit" class="btn btn-primary mt-3">Confirm</button>
      </form>
    </div>
  </div>
</div>
